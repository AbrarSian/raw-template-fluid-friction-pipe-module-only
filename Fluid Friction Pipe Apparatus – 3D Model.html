<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluid Friction Apparatus – 3D Model</title>
<style>
:root{--bg:#0e1317;--bg2:#1c2830;--fg:#e8ecef;--mut:#9aa7b0;--ac:#2fbf71;--or:#ffb703;--card:#141c21e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9eef1;--bg2:#ffffff;--fg:#141b20;--mut:#55636c;--card:#ffffffeb}}
:root[data-theme="dark"]{--bg:#0e1317;--bg2:#1c2830;--fg:#e8ecef;--mut:#9aa7b0;--card:#141c21e6}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,var(--bg2),var(--bg));color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#lay{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.b,.t{position:absolute;left:0;top:0;white-space:nowrap}
.b{width:20px;height:20px;border-radius:50%;background:var(--or);color:#111;font:700 11px/17px system-ui;text-align:center;border:1.5px solid #fffc;box-shadow:0 1px 4px #0006}
.b.p{animation:pl .5s 3}
@keyframes pl{50%{box-shadow:0 0 0 8px #ffb70066}}
.t{font-size:11px;color:var(--fg);background:var(--card);padding:2px 7px;border-radius:10px;border:1px solid #2fbf7188}
.t b{color:var(--ac)}
.card{position:absolute;background:var(--card);border:1px solid #8883;border-radius:12px;padding:8px 11px;backdrop-filter:blur(6px)}
#hd{top:8px;left:8px;max-width:calc(100% - 16px)}
#hd h1{font-size:14px;margin:0 0 1px}
#hd small{color:var(--mut);font-size:11px}
#hd .cr{margin-top:5px;padding-top:5px;border-top:1px solid #8884;font-size:11.5px}
#hd .cr b{font-size:12.5px}
#bar{bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;max-width:calc(100% - 16px)}
button{font:inherit;font-size:12px;color:var(--fg);background:#8882;border:1px solid #8885;border-radius:8px;padding:6px 10px}
button.on{background:var(--ac);color:#06210f;border-color:var(--ac)}
#lg{right:8px;bottom:58px;width:min(330px,calc(100% - 16px));max-height:46%;overflow:auto;display:none}
#lg div.r{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #8882}
#lg i{flex:none;width:19px;height:19px;border-radius:50%;background:var(--or);color:#111;font:700 11px/19px system-ui;text-align:center}
#lg span{display:block;color:var(--mut);font-size:11px}
#lg .k{font-size:11px;color:var(--mut);padding-top:6px}
</style></head><body><div id="app">
<canvas id="c"></canvas><div id="lay"></div>
<div class="card" id="hd"><h1>Fluid Friction Pipe Apparatus</h1><small>3D process model · schematic, not to scale</small>
<div class="cr"><b>A S M Abrar Sian</b><br>Department of Applied Chemistry &amp; Chemical Engineering<br>University of Dhaka</div></div>
<div class="card" id="lg"></div>
<div class="card" id="bar"><button id="bL" class="on">Labels</button><button id="bF" class="on">Flow</button><button id="bS">Spin</button><button id="bR">Reset</button><button id="bG">Legend</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,cv=document.getElementById("c"),lay=document.getElementById("lay");
const R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const S=new T.Scene(),C=new T.PerspectiveCamera(40,1,.1,100);
S.add(new T.HemisphereLight(0xffffff,0x445566,.95));
const dl=new T.DirectionalLight(0xffffff,.85);dl.position.set(4,8,7);S.add(dl);
const G=new T.Group();S.add(G),V=(x,y,z)=>new T.Vector3(x,y,z);
const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,metalness:.45,roughness:.45},o));
const mSt=M(0xb9c0c6),mGr=M(0x2fbf71,{metalness:.2}),mGd=M(0x14703f),mDk=M(0x3b4a54),mBr=M(0xd4a62a),mRd=M(0xd62828,{metalness:.2}),mBl=M(0x2b6fd0,{metalness:.3}),mOr=M(0xffb703,{metalness:.2});
function mesh(g,m,x,y,z,p){const o=new T.Mesh(g,m);o.position.set(x,y,z);(p||G).add(o);return o}
function pipe(a,b,m,r){a=V(...a);b=V(...b);const d=b.clone().sub(a),o=new T.Mesh(new T.CylinderGeometry(r||.06,r||.06,d.length(),16),m||mSt);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());G.add(o)}
const ball=(x,y,m,r)=>mesh(new T.SphereGeometry(r||.07,14,10),m||mSt,x,y,0);
function tex(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);return new T.CanvasTexture(c)}
function sign(t,w,h,x,y,z){return mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t}),x,y,z)}
// labels
const LB=[];
function tag(n,name,desc,x,y,z){const e=document.createElement("div");e.className="b";e.textContent=n;lay.appendChild(e);LB.push({e,p:V(x,y,z),n,name,desc,a:"-50%,-50%"})}
function ttl(txt,sub,x,y){const e=document.createElement("div");e.className="t";e.innerHTML="<b>"+txt+"</b> · "+sub;lay.appendChild(e);LB.push({e,p:V(x,y,0),a:"0,-50%"})}
// floor, frame, back panel
mesh(new T.BoxGeometry(9.5,.06,4.4),M(0x222b31,{metalness:.1}),-.2,-2.56,.4);
sign(tex(1024,256,(g,w,h)=>{g.fillStyle="#0d3b2e";g.fillRect(0,0,w,h);g.strokeStyle="#2fbf71";g.lineWidth=6;g.strokeRect(8,8,w-16,h-16);g.fillStyle="#fff";g.textAlign="center";g.font="bold 44px sans-serif";g.fillText("FLUID FRICTION PIPE APPARATUS",w/2,80);g.fillStyle="#7CFFB2";g.font="bold 46px sans-serif";g.fillText("A S M Abrar Sian",w/2,140);g.fillStyle="#fff";g.font="30px sans-serif";g.fillText("Dept. of Applied Chemistry & Chemical Engineering",w/2,188);g.fillText("University of Dhaka",w/2,228)}),4.6,1.15,.3,-2.52,1.75).rotation.x=-Math.PI/2;
[-3.4,3.4].forEach(x=>mesh(new T.BoxGeometry(.14,7.1,.14),mDk,x,1.05,-.3));
mesh(new T.BoxGeometry(6.9,.12,.12),mDk,0,4.6,-.3);mesh(new T.BoxGeometry(6.9,.12,.12),mDk,0,-.3,-.3);
mesh(new T.BoxGeometry(6.7,4.9,.04),M(0x20303a,{transparent:true,opacity:.8,metalness:.1}),0,2.15,-.4);
// tank
const tk=mesh(new T.BoxGeometry(2.9,1.6,1.4),new T.MeshStandardMaterial({color:0x9fd6ff,transparent:true,opacity:.2,roughness:.1,metalness:0,depthWrite:false}),1.55,-1.7,0);
tk.add(new T.LineSegments(new T.EdgesGeometry(tk.geometry),new T.LineBasicMaterial({color:0xcfe9ff})));
mesh(new T.BoxGeometry(2.8,1.12,1.3),new T.MeshStandardMaterial({color:0x1f78d1,transparent:true,opacity:.55}),1.55,-1.94,0);
mesh(new T.BoxGeometry(2.95,.05,1.45),mSt,1.55,-.875,0);
mesh(new T.CylinderGeometry(.03,.03,1.25,8),mRd,1.2,-1.5,.3);mesh(new T.BoxGeometry(.16,.22,.16),mRd,1.2,-.74,.3);
// pump, VFD, flow meter
const pv=mesh(new T.CylinderGeometry(.34,.34,.3,32),mBl,-.6,-1.7,0);pv.rotation.x=Math.PI/2;
const pm=mesh(new T.CylinderGeometry(.26,.26,.7,32),M(0x2a8c5a),-.6,-1.7,.5);pm.rotation.x=Math.PI/2;
for(let i=0;i<4;i++){mesh(new T.TorusGeometry(.265,.018,6,24),mDk,-.6,-1.7,.28+i*.17)}
sign(tex(128,128,(g,w,h)=>{g.fillStyle="#1b2a33";g.fillRect(0,0,w,h);g.fillStyle="#fff";g.font="bold 90px sans-serif";g.textAlign="center";g.fillText("P",64,98)}),.3,.3,-.6,-1.7,.852);
mesh(new T.BoxGeometry(.4,.5,.5),mDk,-.6,-2.25,.5);mesh(new T.BoxGeometry(.3,.45,.2),mDk,-.6,-2.25,0);
mesh(new T.BoxGeometry(.5,.65,.22),M(0xd8dde0),-.6,-.85,.12);
sign(tex(256,128,(g,w,h)=>{g.fillStyle="#0b1a12";g.fillRect(0,0,w,h);g.fillStyle="#7CFFB2";g.font="bold 54px monospace";g.textAlign="center";g.fillText("VFD",w/2,60);g.font="32px monospace";g.fillText("35.0 Hz",w/2,106)}),.4,.2,-.6,-.75,.232);
pipe([-.6,-1.18,.12],[-.6,-1.46,.45],M(0x111111),.02);
const fm=mesh(new T.BoxGeometry(.5,.5,.4),mDk,-1.9,-1.7,0);
sign(tex(128,128,(g,w,h)=>{g.fillStyle="#0b1a12";g.fillRect(0,0,w,h);g.fillStyle="#7CFFB2";g.font="bold 96px sans-serif";g.textAlign="center";g.fillText("Q",64,100)}),.34,.34,-1.9,-1.7,.201);
// main loop pipes
pipe([.1,-1.7,0],[-2.8,-1.7,0]);pipe([-2.8,-1.7,0],[-2.8,4,0]);pipe([2.8,4,0],[2.8,-1.15,0]);
ball(-2.8,-1.7);ball(-2.8,4);ball(2.8,4);
[4,3,2.1,.4].forEach(y=>ball(-2.8,y,mSt,.075));[4,3,1.4,.4].forEach(y=>ball(2.8,y,mSt,.075));
const cone=(x,y,r)=>mesh(new T.ConeGeometry(.11,.27,16),mOr,x,y,0).rotation.z=r;
cone(-1.28,-1.7,Math.PI/2);cone(2.8,3.5,Math.PI);cone(-2.8,-.7,0);
// test lines
const seg=(x1,y1,x2,y2,g)=>pipe([x1,y1,0],[x2,y2,0],g?mGr:mSt);
function isoV(x,y){const g=new T.Group();g.position.set(x,y,0);G.add(g);mesh(new T.CylinderGeometry(.14,.14,.3,20),mBl,0,0,0,g).rotation.z=Math.PI/2;
mesh(new T.CylinderGeometry(.03,.03,.24,8),mSt,0,.2,0,g);mesh(new T.TorusGeometry(.12,.022,8,20),mRd,0,.34,0,g).rotation.x=Math.PI/2;
[-.16,.16].forEach(d=>mesh(new T.CylinderGeometry(.1,.1,.03,16),mSt,d,0,0,g).rotation.z=Math.PI/2)}
function tap(x,y){mesh(new T.CylinderGeometry(.025,.025,.34,8),mSt,x,y,.17).rotation.x=Math.PI/2;mesh(new T.TorusGeometry(.065,.02,8,20),mGr,x,y,.35);return [x,y,.35]}
function dpt(x,y,z,a,b){mesh(new T.BoxGeometry(.5,.3,.2),mDk,x,y,z);mesh(new T.PlaneGeometry(.26,.12),new T.MeshBasicMaterial({color:0x7CFFB2}),x+.08,y+.03,z+.101);const m=M(0x2b8cff,{metalness:.1});pipe(a,[x-.15,y-.15,z],m,.012);pipe(b,[x+.15,y-.15,z],m,.012)}
// smooth + rough
[4,3].forEach((y,i)=>{seg(-2.8,y,-.9,y,0);seg(-.9,y,.9,y,1);seg(.9,y,2.8,y,0);
if(i)for(let x=-.85;x<.9;x+=.1)mesh(new T.TorusGeometry(.068,.022,6,16),mGd,x,y,0).rotation.y=Math.PI/2;
dpt(0,y-.5,.8,tap(-.9,y),tap(.9,y))});
// 90 deg bend
seg(-2.8,2.1,-1.2,2.1,0);seg(-1.2,2.1,0,2.1,1);pipe([0,2.1,0],[0,1.4,0],mGr);seg(0,1.4,1.7,1.4,1);seg(1.7,1.4,2.8,1.4,0);ball(0,2.1,mGr,.065);ball(0,1.4,mGr,.065);
dpt(.95,1.75,.8,tap(-1.2,2.1),tap(1.7,1.4));
// ball valve line
seg(-2.8,.4,-1.9,.4,0);seg(-1.9,.4,1.7,.4,1);seg(1.7,.4,2.8,.4,0);
const bv=new T.Group();bv.position.set(-.7,.4,0);G.add(bv);
mesh(new T.SphereGeometry(.17,20,16),mBr,0,0,0,bv);mesh(new T.CylinderGeometry(.03,.03,.22,8),mSt,0,.2,0,bv);mesh(new T.BoxGeometry(.42,.04,.05),mRd,.12,.32,0,bv);
[-.2,.2].forEach(d=>mesh(new T.CylinderGeometry(.1,.1,.03,16),mSt,d,0,0,bv).rotation.z=Math.PI/2);
dpt(0,-.1,.8,tap(-1.9,.4),tap(1.7,.4));
[[4,4],[3,3],[2.1,1.4],[.4,.4]].forEach(([a,b])=>{isoV(-2.35,a);isoV(2.35,b)});
// titles + tags
ttl("Smooth pipe","taps 1.0 m apart",-2.7,4.34);ttl("Rough pipe","taps 1.0 m apart",-2.7,3.34);
ttl("90° bend","taps 10D before, 20D after",-2.7,2.44);ttl("Ball valve","taps 10D before, 20D after",-2.7,.74);
tag(1,"Water tank (≥60 L)","Transparent reservoir that supplies and receives the circulating water.",2.5,-.95,.72);
tag(2,"T probe","Temperature probe in the tank; sets viscosity and density for Re and f.",1.2,-.5,.3);
tag(3,"Pump","Centrifugal pump driven by an electric motor.",-.6,-2.0,.9);
tag(4,"VFD","Variable-frequency drive; varies pump speed to set the flow rate.",-.32,-.5,.2);
tag(5,"Flow meter (Q)","Measures volumetric flow rate through the loop.",-1.9,-1.35,.25);
tag(6,"Smooth pipe test section","Smooth-bore pipe; friction factor vs Reynolds number.",1.6,4.25,0);
tag(7,"Rough pipe test section","Artificially roughened pipe (ribbed here) for relative-roughness effects.",1.6,3.25,0);
tag(8,"90° bend","Elbow test; loss coefficient K from ΔP.",-.28,1.75,0);
tag(9,"Ball valve (test)","Valve under test; K vs opening angle.",-.7,.12,0);
tag(10,"Pressure tap","Wall tap giving a ΔP signal; 1.0 m apart on straight pipes, 10D upstream and 20D downstream for fittings.",-.9,4.2,.35);
tag(11,"Measured span","Green section between the two taps over which ΔP is read.",.5,3.86,0);
tag(12,"Isolation valve","Gate valves at both ends let each test line be opened or closed independently.",-2.35,.1,0);
tag(13,"Differential pressure transmitter","Connected to the two taps by impulse tubing; reads ΔP.",.5,3.38,.8);
tag(14,"Supply header","Pump discharge manifold; flow rises on the left.",-2.8,1.1,0);
tag(15,"Return header","Collects flow from all lines and returns it to the tank.",2.8,2.5,0);
tag(16,"Support frame and panel","Steel frame with back panel carrying the pipe network.",3.4,4.6,-.3);
tag(17,"Flow direction arrow","Water leaves the tank, passes the pump and flow meter, rises up the supply header, crosses the open test line and returns.",2.8,3.5,.15);
const lg=document.getElementById("lg");lg.innerHTML=LB.filter(l=>l.n).map(l=>`<div class="r" data-n="${l.n}"><i>${l.n}</i><div><b>${l.name}</b><span>${l.desc}</span></div></div>`).join("")+"<div class='k'>Green ring = tap · green pipe = measured span · tap D = pipe diameter</div>";
lg.onclick=e=>{const r=e.target.closest(".r");if(!r)return;const b=LB.find(l=>l.n==r.dataset.n).e;b.classList.remove("p");void b.offsetWidth;b.classList.add("p")};
// flow dots
const D=[],dg=new T.Group();G.add(dg);
function path(mid){const p=[[.1,-1.7],[-2.8,-1.7],...mid,[2.8,-1.15]].map(a=>V(a[0],a[1],0));let L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+p[i].distanceTo(p[i-1]));return{p,L,len:L[L.length-1]}}
[[[-2.8,4],[2.8,4]],[[-2.8,3],[2.8,3]],[[-2.8,2.1],[0,2.1],[0,1.4],[2.8,1.4]],[[-2.8,.4],[2.8,.4]]].forEach(m=>{const P=path(m);for(let i=0;i<14;i++){const o=mesh(new T.SphereGeometry(.055,10,8),new T.MeshBasicMaterial({color:0x8fe0ff}),0,0,0,dg);D.push({o,P,k:i/14})}});
function at(P,s){let i=1;while(i<P.L.length-1&&P.L[i]<s)i++;const f=(s-P.L[i-1])/(P.L[i]-P.L[i-1]);return P.p[i-1].clone().lerp(P.p[i],f)}
// camera
let th=.5,ph=1.2,rad=12.5,tg=V(0,1,.3),touched=0,spin=0;
function cam(){C.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));C.lookAt(tg)}
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();if(!touched){rad=w/h<1.1?Math.min(30,13.5/(w/h)*.95):12.5;if(w/h>2)rad=14}}
function reset(){th=.5;ph=1.2;touched=0;fit();cam()}
addEventListener("resize",()=>{fit();cam()});fit();cam();
const pt=new Map();let pd=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pt.set(e.pointerId,e);touched=1});
cv.addEventListener("pointerup",e=>pt.delete(e.pointerId));cv.addEventListener("pointercancel",e=>pt.delete(e.pointerId));
cv.addEventListener("pointermove",e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId);
if(pt.size==1){th-=(e.clientX-o.clientX)*.006;ph=Math.max(.15,Math.min(1.65,ph-(e.clientY-o.clientY)*.006))}
else if(pt.size==2){const q=[...pt.values()].find(v=>v.pointerId!=e.pointerId),d0=Math.hypot(o.clientX-q.clientX,o.clientY-q.clientY),d1=Math.hypot(e.clientX-q.clientX,e.clientY-q.clientY);rad=Math.max(4,Math.min(34,rad*d0/d1))}
pt.set(e.pointerId,e);cam()});
cv.addEventListener("wheel",e=>{e.preventDefault();touched=1;rad=Math.max(4,Math.min(34,rad*Math.exp(e.deltaY*.001)));cam()},{passive:false});
// controls
const $=i=>document.getElementById(i);let showL=1,showF=1;
$("bL").onclick=e=>{showL=!showL;lay.style.display=showL?"":"none";e.target.classList.toggle("on",!!showL)};
$("bF").onclick=e=>{showF=!showF;dg.visible=!!showF;e.target.classList.toggle("on",!!showF)};
$("bS").onclick=e=>{spin=!spin;e.target.classList.toggle("on",!!spin)};
$("bR").onclick=reset;$("bG").onclick=e=>{const s=lg.style.display=="block";lg.style.display=s?"none":"block";e.target.classList.toggle("on",!s)};
// loop
function loop(t){requestAnimationFrame(loop);if(spin){th+=.004;cam()}
if(showF)D.forEach(d=>{const u=((t/1000*1.3)/d.P.len+d.k)%1;d.o.position.copy(at(d.P,u*d.P.len))});
const w=innerWidth,h=innerHeight;if(showL)LB.forEach(l=>{const v=l.p.clone().project(C);const ok=v.z<1;l.e.style.display=ok?"":"none";if(ok)l.e.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(${l.a.split(",").map((s,i)=>s.includes("%")?s:s+"px").join(",")})`});
R.render(S,C)}
requestAnimationFrame(loop);
</script></body></html>
